      - generic [ref=e60]:
        - heading "Founder's Note" [level=2] [ref=e61]
        - generic [ref=e62]:
          - paragraph [ref=e63]: I started SympliCare after spending time in care homes, watching dedicated teams struggle with fragmented systems that made their jobs harder, not easier.
          - paragraph [ref=e64]: These professionals are already stretched thin. They don't need more apps, more dashboards, or more complexity. They need systems that understand their world and fit into it.
          - paragraph [ref=e65]: What struck me most wasn't the technology gaps—it was how much institutional knowledge and context gets lost between shifts, between systems, and between departments.
          - paragraph [ref=e66]: A fall that occurs at night gets documented hours later. Training gets entered manually into three separate systems. Inspection preparation becomes a week of manual file organization.
          - paragraph [ref=e67]: None of these problems exist because of laziness or incompetence. They exist because the tools weren't designed by people who understand the actual operational reality of care homes.
          - paragraph [ref=e68]: SympliCare is being built differently. We're not coming with preconceived solutions. We're listening first. We're learning what actually works in practice. And we're committing to building only what's truly needed.
          - paragraph [ref=e69]: I believe that care home operations can be simpler, clearer, and more reliable—not through complexity, but through genuine understanding of what your teams face every day.
          - paragraph [ref=e70]: That's what we're building.
